# Локальная разработка: Postgres в контейнере, приложение запускается через pnpm dev.
# DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/redone
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: redone
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
